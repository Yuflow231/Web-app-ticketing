<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketingApp - Projects</title>
    <link href="custom.css" rel="stylesheet"/>
    <script src="side-bar.js" defer></script>
</head>
<body>
    <!-- Navigation bars -->
    <nav class="navigation">
        <header class="top-bar">
            <div class="menu-bar">
                <span class="hamburger"><i class="fa-solid fa-bars"></i></span>
                <span>| Ticketing app shenanigans</span>
            </div>
            <div class="user-profile-header">
                <a href="profile.html">
                    <span class="username" data-type="first-name">User</span>
                    <span class="username" data-type="last-name">Name</span>
                    <!-- placeholder using my YouTube profile pic -->
                    <img src="https://yt3.ggpht.com/pz97Hxe-gW4DR1-S4HmoZopwKXppAHPajMDtCaSSM-3HNV31wECJmegkZAohyEh7qAbCNQAHUg=s176-c-k-c0x00ffffff-no-rj" alt="User Profile" class="profile-pic" >
                </a>
            </div>
        </header>

        <!-- Side navigation bar -->
        <div class="side-nav">
            <div class="top-side">
                <a href="dashBoard.html">
                    <span class="icon"><i class="fa-solid fa-chart-line"></i></span>
                    <span class="text">Dashboard</span>
                </a>
                <a href="projects.html" id="active">
                    <span class="icon"><i class="fa-solid fa-diagram-project"></i></span>
                    <span class="text">Projects</span>
                </a>
                <a href="tickets.html">
                    <span class="icon"><i class="fa-solid fa-ticket"></i></span>
                    <span class="text">Tickets</span>
                </a>
                <a href="profile.html">
                    <span class="icon"><i class="fa-solid fa-user"></i></span>
                    <span class="text">Profile</span>
                </a>
            </div>

            <a href="index.html">
                <span class="icon"><i class="fa-solid fa-right-from-bracket"></i></span>
                <span class="text">Logout</span>
            </a>

        </div>
    </nav>

    <!-- Page content -->
    <main class="main-content">
        <header class="page-header">
            <div class="page-header-line">
                <h2>My projects</h2>
                <a href="project-creation.html"><button type="button" class="btn">New project</button></a>
            </div>
            <div class="page-header-line">
                <div class="filter">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="On Going">On Going</option>
                        <option value="On Hold">On Hold</option>
                        <option value="Inactive">Inactive</option>
                        <option  value="Closed">Closed</option>
                    </select>
                </div>
                <div class="filter">
                    <label for="search">Search</label>
                    <input type="text" id="search" name="search" placeholder="Search Project">
                </div>
            </div>
        </header>

        <!-- Project tab-->
        <section class="projects-list">
            <div class="table-btns table-header">
                <button class="btn"><</button>
                <span>Page 1 of 1</span>
                <button class="btn">></button>
            </div>
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Project name</th>
                            <th>Client</th>
                            <th>Status</th>
                            <th>Progress</th>
                            <th>Creation date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td data-label="ID">#101</td>
                        <td data-label="Project name">Skyblocker</td>
                        <td data-label="Client">
                            <div class="collab-item">
                                <img src="https://via.placeholder.com/40" class="profile-pic" alt="profile-picture" style="width:40px; height:40px;">
                                <strong>VicIsACat</strong>
                            </div>
                        </td>
                        <td data-label="Status">
                            <span class="status-badge completed">On Going</span>
                        </td>
                        <td data-label="Progress">
                            <div class="progress-container">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 3%;"></div>
                                </div>
                                <div class="progress-percentage">3%</div>
                            </div>
                        </td>
                        <td data-label="Creation date">52/02/1996</td>
                        <td data-label="Actions"><a href="project-details.html" class="icon"><i class="fa-solid fa-arrow-up-right-from-square"></i></a></td>
                    </tr>
                    <tr>
                        <td data-label="ID">#102</td>
                        <td data-label="Project name">Customizable Player Model</td>
                        <td data-label="Client">
                            <div class="collab-item">
                                <img src="https://via.placeholder.com/40" class="profile-pic" alt="profile-picture" style="width:40px; height:40px;">
                                <strong>tom54541</strong>
                            </div>
                        </td>
                        <td data-label="Status">
                            <span class="status-badge new">On Hold</span>
                        </td>
                        <td data-label="Progress">
                            <div class="progress-container">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 75%;"></div>
                                </div>
                                <div class="progress-percentage">75%</div>
                            </div>
                        </td>
                        <td data-label="Creation date">30/01/2026</td>
                        <td data-label="Actions"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="table-btns table-footer">
                <button class="btn"><</button>
                <span>Page 1 of 1</span>
                <button class="btn">></button>
            </div>
        </section>
    </main>
</body>
</html>
