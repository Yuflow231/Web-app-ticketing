<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketingApp - Projects</title>
    <link href="custom.css" rel="stylesheet"/>
</head>
<body>
    <!-- Navigation bars -->
    <div class="navigation">
        <header class="top-bar">
            <p>Ticketing app shenanigans |</p>
            <div>
                <a href="index.html">
                    <button type="button" class="btn"> Logout</button>
                </a>
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
                    <button type="button" class="btn">The other Logout</button>
                </a>
            </div>
        </header>

        <!-- Side navigation bar -->
        <div class="side-nav">
            <a href="dashBoard.html">
                <span class="icon"><i class="fa-solid fa-chart-line"></i></span>
                <span class="text">Dashboard</span>
            </a>
            <a href="projects.html" class="active">
                <span class="icon"><i class="fa-solid fa-diagram-project"></i></span>
                <span class="text">Projects</span>
            </a>
            <a href="tickets.html">
                <span class="icon"><i class="fa-solid fa-ticket"></i></span>
                <span class="text">Tickets</span>
            </a>
            <a href="#">
                <span class="icon"><i class="fa-solid fa-gear"></i></span>
                <span class="text">Settings</span>
            </a>
        </div>

    </div>

    <!-- Page content -->
    <main class="main-content">
        <header class="page-header">
            <h2>My projects</h2>
            <a href="project-creation.html"><button type="button" class="btn">New project</button></a>
        </header>

        <!-- Project tab-->
        <section class="projects-list">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Client</th>
                        <th>Status</th>
                        <th>Progress</th>
                        <th>Creation date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                <tr>
                    <td>#101</td>
                    <td>Skyblocker</td>
                    <td>VicIsACat</td>
                    <td>OnGoing</td>
                    <td>
                        <div class="progress-container">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 3%;"></div>
                            </div>
                            <div class="progress-percentage">3%</div>
                        </div>
                    </td>
                    <td>52/02/1996</td>
                    <td></td>
                </tr>
                <tr>
                    <td>#102</td>
                    <td>Customizable Player Model</td>
                    <td>tom54541</td>
                    <td>On Hold</td>
                    <td>
                        <div class="progress-container">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 75%;"></div>
                            </div>
                            <div class="progress-percentage">75%</div>
                        </div>
                    </td>
                    <td>30/01/2026</td>
                    <td></td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
