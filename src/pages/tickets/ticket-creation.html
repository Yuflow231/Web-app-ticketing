<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket creation - Ticketing App</title>
    <link rel="stylesheet" href="/src/assets/css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js" defer></script>
    <script type="module" src="/src/assets/js/side-bar.js"></script>
    <script type="module" src="/src/assets/js/drag-n-drop.js"></script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navigation">
        <header class="top-bar">
            <div class="menu-bar">
                <span class="hamburger"><i class="fa-solid fa-bars"></i></span>
                <span>| Ticketing App</span>
            </div>
            <div class="user-profile-header">
                <a href="/src/pages/profile.html" class="user-profile-inline">
                    <span class="username" data-type="first-name">User</span>
                    <span class="username" data-type="last-name">Name</span>
                    <!-- placeholder using my YouTube profile pic -->
                    <img src="https://yt3.ggpht.com/pz97Hxe-gW4DR1-S4HmoZopwKXppAHPajMDtCaSSM-3HNV31wECJmegkZAohyEh7qAbCNQAHUg=s176-c-k-c0x00ffffff-no-rj" alt="User Profile" class="profile-pic" >
                </a>
            </div>
        </header>

        <!-- Side Navigation Bar -->
        <div class="side-nav">
            <div class="top-side">
                <a href="/src/pages/dashBoard.html">
                    <span class="icon"><i class="fa-solid fa-chart-line"></i></span>
                    <span class="text">Dashboard</span>
                </a>
                <a href="/src/pages/projects/projects.html">
                    <span class="icon"><i class="fa-solid fa-diagram-project"></i></span>
                    <span class="text">Projects</span>
                </a>
                <a href="/src/pages/tickets/tickets.html" class="active">
                    <span class="icon"><i class="fa-solid fa-ticket"></i></span>
                    <span class="text">Tickets</span>
                </a>
                <a href="/src/pages/profile.html">
                    <span class="icon"><i class="fa-solid fa-user"></i></span>
                    <span class="text">Profile</span>
                </a>
            </div>

            <a href="/index.html">
                <span class="icon"><i class="fa-solid fa-right-from-bracket"></i></span>
                <span class="text">Logout</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <header class="page-header">
            <h1>Ticket creation</h1>
        </header>

        <form id="ticket-form" class="form-box">
            <div class="form-2elements">
                <div class="form-item-stacked">
                    <label for="ticket-title">Ticket's object *</label>
                    <input type="text" id="ticket-title" name="ticket-title" placeholder="Ticket's object">
                </div>
                <div class="form-item-stacked">
                    <label for="ticket-project">Associated project *</label>
                    <select id="ticket-project" name="ticket-project">
                        <option value="" disabled selected hidden>Select a project</option>
                        <option value="Skyblocker">Skyblocker</option>
                    </select>
                </div>
            </div>

            <div class="form-2elements">
                <div class="form-item-stacked">
                    <label for="due-date">Due to *</label>
                    <input type="date" id="due-date" name="due-date">
                </div>
                <div class="form-item-stacked">
                    <label for="ticket-priority">Priority *</label>
                    <select id="ticket-priority" name="ticket-priority">
                        <option value="" disabled selected hidden>Select a priority</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
            </div>

            <div class="form-item-stacked">
                <label for="ticket-description">Description</label>
                <textarea id="ticket-description" name="ticket-description" rows="8" placeholder="Ticket's description"></textarea>
            </div>

            <div class="form-item-stacked">
                <label for="drop-file">Attached files</label>
                <div id="drop-zone">
                    <p>Drag and drop files here or click to select files</p>
                    <input type="file" id="drop-file" name="drop-file" multiple style="display: none;">
                </div>
                <ul id="file-list"></ul>
            </div>

            <div class="centered" style="display: flex; gap: var(--spacing-md); justify-content: center;">
                <a href="/src/pages/tickets/tickets.html">
                    <button type="button" class="btn btn--outline">Cancel</button>
                </a>
                <button id="actions" class="btn">Create ticket</button>
            </div>
        </form>
    </main>
</body>
<script type="module">
    // Set as module to allow imports
    import Toast from "/src/assets/js/toast.js";

    // prevent multiple request when the infos are correct
    let canPress = true;

    // Get reference to form button
    let testButton = document.getElementById("actions");

    // Add click event on the previously got button
    testButton.addEventListener("click", (e) => {
        e.preventDefault();
        if (canPress){
            verifyForm();
        }
    });

    function verifyForm(){
        // Get references to form's field
        let formTitle = document.getElementById("ticket-title");
        let formProject = document.getElementById("ticket-project");

        let formDate = document.getElementById("due-date");
        let formPriority = document.getElementById("ticket-priority");

        // check if empty / not set
        if (formTitle.value.length <= 0) {
            Toast("Please enter a title", "error");
            return;
        }
        // Check if the project is still the default (empty value)
        else if (formProject.value === "") {
            Toast("Please chose the associated project", "error");
            return;
        }
        else if (formDate.value === "") {
            Toast("Please select a due date", "error");
            return;
        }
        // Same for priority
        else if (formPriority.value === "") {
            Toast("Please chose the priority level", "error");
            return;
        }

        // Date Validation
        const selectedDate = new Date(formDate.value);
        const today = new Date();

        // Set time to 00:00:00 to compare only the calendar date
        today.setHours(0, 0, 0, 0);

        if (selectedDate < today) {
            Toast("Invalid due date", "error");
            return;
        }

        // if everything checks out
        Toast("Creating ticket ...", "success");
        canPress = false;
        setTimeout(() => {
            location.href = "/src/pages/tickets/tickets.html";
        }, 1500);
    }
</script>
</html>
