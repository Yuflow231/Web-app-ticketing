<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TicketingApp</title>

    <link href="custom.css" rel="stylesheet"/>
</head>
<body>

    <div id="login-box">
        <form action="" method="get" class="form-content">
            <h2>Reset your password</h2>
            <div class="form-item-stacked">
                <label for="form-email">Email</label>
                <input type="email" id="form-email" placeholder="Email" required>
            </div>
            <div class="form-item-stacked">
                <label for="form-new-password">New password</label>
                <input type="password" id="form-new-password" placeholder="Password" required>
            </div>
            <div class="form-item-stacked">
                <label for="form-password-confirmation">Confirm password</label>
                <input type="password" id="form-password-confirmation" placeholder="Confirm Password" required>
            </div>
            <div class="centered"><a href="../../index.html" ><button id="send" type="button" class="btn">Change password</button></a></div>
        </form>
    </div>

</body>
</html>
