<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password - Ticketing App</title>
    <link rel="stylesheet" href="/src/assets/css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js" defer></script>
</head>
<body>
    <div id="login-box">
        <form id="reset-form" class="form-content card-wo-hover">
            <h2 style="text-align: center">Reset password</h2>
            <p style="text-align: center; color: var(--text-secondary); margin-bottom: var(--spacing-lg);">
                Enter your email address to reset your password.
            </p>

            <div class="form-item-stacked">
                <label for="form-email">Email</label>
                <input type="email" id="form-email" name="email" placeholder="Email" required>
            </div>

            <div class="centered">
                <button class="btn" id="actions">Send link</button>
            </div>

            <div class="centered" style="margin-top: var(--spacing-md);">
                <a href="/index.html">
                    <button type="button" class="btn btn--outline">Back to login</button>
                </a>
            </div>
        </form>
    </div>
</body>
<script type="module">
    // Set as module to allow imports
    import Toast from "/src/assets/js/toast.js";

    // Get reference to form button
    let testButton = document.getElementById("actions");

    // Add click event on the previously got button
    testButton.addEventListener("click", (e) => {
        e.preventDefault();
        verifyForm();
    });

    function verifyForm(){
        // regex to check mail validity
        const regexMail = "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"

        // Get references to form's field
        let formMail = document.getElementById("form-email");

        let emailFormError = !formMail.value.trim().match(regexMail);

        // Clear previous highlights
        formMail.classList.remove("error-field");

        if (formMail.value.length <= 0) {
            formMail.classList.add("error-field");
            Toast("Email is required", "error");
            return;
        }
        else if (emailFormError) {
            formMail.classList.add("error-field");
            Toast("Please enter a valid email address", "error");
            return;
        }

        // if everything checks out
        Toast("Sending reset link", "success");
    }
</script>
</html>
