<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketingApp - Ticket</title>
    <link href="custom.css" rel="stylesheet"/>
    <script src="side-bar.js" defer></script>
</head>
<body>
    <!-- Navigation bars -->
    <nav class="navigation">
        <header class="top-bar">
            <div class="menu-bar">
                <span class="hamburger"><i class="fa-solid fa-bars"></i></span>
                <span>| Ticketing app shenanigans</span>
            </div>
            <div class="user-profile-header">
                <a href="profile.html">
                    <span class="username" data-type="first-name">User</span>
                    <span class="username" data-type="last-name">Name</span>
                    <!-- placeholder using my YouTube profile pic -->
                    <img src="https://yt3.ggpht.com/pz97Hxe-gW4DR1-S4HmoZopwKXppAHPajMDtCaSSM-3HNV31wECJmegkZAohyEh7qAbCNQAHUg=s176-c-k-c0x00ffffff-no-rj" alt="User Profile" class="profile-pic" >
                </a>
            </div>
        </header>

        <!-- Side navigation bar -->
        <div class="side-nav">
            <div class="top-side">
                <a href="dashBoard.html">
                    <span class="icon"><i class="fa-solid fa-chart-line"></i></span>
                    <span class="text">Dashboard</span>
                </a>
                <a href="projects.html">
                    <span class="icon"><i class="fa-solid fa-diagram-project"></i></span>
                    <span class="text">Projects</span>
                </a>
                <a href="tickets.html" id="active">
                    <span class="icon"><i class="fa-solid fa-ticket"></i></span>
                    <span class="text">Tickets</span>
                </a>
                <a href="profile.html">
                    <span class="icon"><i class="fa-solid fa-user"></i></span>
                    <span class="text">Profile</span>
                </a>
            </div>

            <a href="index.html">
                <span class="icon"><i class="fa-solid fa-right-from-bracket"></i></span>
                <span class="text">Logout</span>
            </a>

        </div>
    </nav>

    <!-- Page content -->
    <main class="main-content">
        <header class="page-header">
            <div class="page-header-line">
                <h2>My tickets</h2>
                <a href="ticket-creation.html"><button type="button" class="btn">New ticket</button></a>
            </div>
            <div class="page-header-line">
                <div class="filter">
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority">
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                <div class="filter">
                    <label for="search">Search</label>
                    <input type="text" id="search" name="search" placeholder="Search Ticket">
                </div>
            </div>
        </header>

        <!-- Tickets section -->
        <section class="tickets">
            <div class="table-btns table-header">
                <button class="btn"><</button>
                <span>Page 1 of 1</span>
                <button class="btn">></button>
            </div>
            <div class="table-card">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Project</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Assigned</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>#101</td>
                        <td><strong>Fix Login Authentication</strong></td>
                        <td>Mobile App</td>
                        <td><span class="status-badge in-progress">In Progress</span></td>
                        <td><span class="priority-badge high">High</span></td>
                        <td>
                            <div class="collab-avatars">
                                <img src="https://via.placeholder.com/25" title="Sarah Jenkins" alt="profile-picture" class="mini-avatar">
                                <img src="https://via.placeholder.com/25" title="Mark Thompson" alt="profile-picture" class="mini-avatar">
                            </div>
                        </td>
                        <td><a href="ticket-details.html" class="icon"><i class="fa-solid fa-arrow-up-right-from-square"></i></a></td>
                    </tr>

                    <tr>
                        <td>#102</td>
                        <td><strong>Update Dashboard UI</strong></td>
                        <td>Web App</td>
                        <td><span class="status-badge new">New</span></td>
                        <td><span class="priority-badge medium">Medium</span></td>
                        <td>
                            <div class="collab-avatars">
                                <img src="https://via.placeholder.com/25" title="Unassigned" alt="profile-picture" class="mini-avatar grayscale">
                            </div>
                        </td>
                        <td></td>
                    </tr>
                    </tbody>
                    </table>
            </div>
            <div class="table-btns table-footer">
                <button class="btn"><</button>
                <span>Page 1 of 1</span>
                <button class="btn">></button>
            </div>
        </section>
    </main>
</body>
</html>
