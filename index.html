<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TicketingApp</title>

    <link href="custom.css" rel="stylesheet"/>
</head>
<body>

    <div id="login-box">
        <form action="" method="get" class="form-content">
            <h2>Login</h2>
            <div class="form-item-stacked">
                <label for="form-email">Email</label>
                <input type="email" id="form-email" placeholder="Email" required>
            </div>
            <div class="form-item-stacked">
                <label for="form-password">Password</label>
                <input type="password" id="form-password" placeholder="Password" required>
            </div>
            <div class="form-forgot"><a href="resetPassword.html">Forgot your password?</a></div>
            <div class="centered"><a href="dashBoard.html" ><button id="send" type="button" class="btn">Login</button></a></div>
        </form>
    </div>

</body>
</html>
