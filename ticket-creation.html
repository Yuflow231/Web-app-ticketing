<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketingApp - Projects</title>
    <link href="custom.css" rel="stylesheet"/>

    <script src="drag&drop.js" defer></script>
</head>
<body>
    <!-- Navigation bars -->
    <nav class="navigation">
        <header class="top-bar">
            <p>Ticketing app shenanigans |</p>
            <div class="user-profile-header">
                <a href="profile.html">
                    <span class="username" data-type="first-name">User</span>
                    <span class="username" data-type="last-name">Name</span>
                    <!-- placeholder using my YouTube profile pic -->
                    <img src="https://yt3.ggpht.com/pz97Hxe-gW4DR1-S4HmoZopwKXppAHPajMDtCaSSM-3HNV31wECJmegkZAohyEh7qAbCNQAHUg=s176-c-k-c0x00ffffff-no-rj" alt="User Profile" class="profile-pic" >
                </a>
            </div>
        </header>

        <!-- Side navigation bar -->
        <div class="side-nav">
            <div class="top-side">
                <a href="dashBoard.html">
                    <span class="icon"><i class="fa-solid fa-chart-line"></i></span>
                    <span class="text">Dashboard</span>
                </a>
                <a href="projects.html">
                    <span class="icon"><i class="fa-solid fa-diagram-project"></i></span>
                    <span class="text">Projects</span>
                </a>
                <a href="tickets.html" id="active">
                    <span class="icon"><i class="fa-solid fa-ticket"></i></span>
                    <span class="text">Tickets</span>
                </a>
                <a href="profile.html">
                    <span class="icon"><i class="fa-solid fa-user"></i></span>
                    <span class="text">Profile</span>
                </a>
            </div>

            <a href="index.html">
                <span class="icon"><i class="fa-solid fa-right-from-bracket"></i></span>
                <span class="text">Logout</span>
            </a>

        </div>
    </nav>

    <main class="main-content">
        <header class="page-header">
            <h1>Ticket creation</h1>
        </header>

        <form id="creation-form" class="form-box" action="/submit-ticket" method="POST">
            <div class="form-2elements">
                <div class="form-item-stacked">
                    <label for="ticket-name">Ticket's object</label>
                    <input type="text" id="ticket-name" name="ticket-name" placeholder="Ticket's object" required>
                </div>
                <div class="form-item-stacked">
                    <label for="client-project">Project associated</label>
                    <select id="client-project" name="client-project" required>
                        <option value="project-1">Project 1</option>
                        <option value="project-2">Project 2</option>
                    </select>
                </div>
            </div>

            <div class="form-2elements">
                <div class="form-item-stacked">
                    <label for="end-date">Due to</label>
                    <input type="date" id="end-date" name="end-date" required>
                </div>
                <div class="form-item-stacked">
                    <label for="ticket-priority">Priority</label>
                    <select id="ticket-priority" name="ticket-priority" required>
                        <option value="priority-high">High</option>
                        <option value="priority-medium">Medium</option>
                        <option value="priority-low">Low</option>
                    </select>
                </div>
            </div>

            <!-- Description -->
            <label for="ticket-description">Description</label>
            <textarea id="ticket-description" name="ticket-description" rows="8" placeholder="Ticket description" required></textarea>

            <!-- File drop -->
            <div class="form-item">
                <label for="drop-file">Attach files</label>
                <div id="drop-zone">
                    <p>Drag and drop files here or click to select files</p>
                    <input type="file" id="drop-file" name="drop-file" multiple style="display: none;">
                </div>
                <ul id="file-list"></ul>
            </div>

            <div class="centered"><a href="tickets.html"><button type="button" class="btn">Create ticket</button></a></div>
        </form>
    </main>
</body>
</html>
